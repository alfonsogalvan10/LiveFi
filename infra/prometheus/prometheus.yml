# ============================================================
# Prometheus — scrape configuration (Tier 6)
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: livefi
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: kong
    static_configs:
      - targets: ["kong:8001"]
    metrics_path: /metrics

  - job_name: ingestion-api
    static_configs:
      - targets: ["ingestion-api:8080"]
    metrics_path: /metrics

  - job_name: query-api
    static_configs:
      - targets: ["query-api:8080"]
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9308"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:8080"]
